[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-slide-maker"
version = "0.1.0"
description = "AI-powered PPTX presentation maker via MCP — driven by Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-pptx>=1.0.0",
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
slide-maker = "slide_maker.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_maker"]
